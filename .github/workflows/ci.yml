name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: https://api.example.com/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Unit and security scan tests
        run: npm run test:unit
      - run: npm run build
      - name: No secrets in the browser bundle
        run: node scripts/check-bundle-secrets.mjs dist
      - name: No known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high
